<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Notes</title>
<style>
	/* Only what the loader itself draws. Everything the note pane looks like arrives from the
	   extension at runtime, so a change to the pane never touches this file - and this file is the
	   one that costs a patch and a VS Code restart to replace. */
	html, body {
		height: 100%;
		margin: 0;
	}
	body {
		display: flex;
		flex-direction: column;
		background: #1e1e1e;
		color: #ddd;
		font: 12px/1.5 "Segoe UI", sans-serif;
	}
	/* The loader's own surface: what is shown before a pane arrives, and instead of one when it
	   cannot run. */
	#ainotes-boot {
		flex: 1 1 auto;
		min-height: 0;
		margin: 8px;
		padding: 12px;
		border: 1px solid #3a3a3a;
		border-radius: 10px;
		background: #232323;
		line-height: 1.6;
	}
	#ainotes-boot a {
		color: #6cb6ff;
		cursor: pointer;
		text-decoration: underline;
	}
	#ainotes-boot .detail {
		margin-top: 6px;
		opacity: 0.65;
	}
	#ainotes-root {
		flex: 1 1 auto;
		min-height: 0;
		display: none;
		flex-direction: column;
	}
</style>
</head>
<body>
	<div id="ainotes-boot">Connecting to AI Notes...</div>
	<div id="ainotes-root"></div>

	<script>
		(function () {
			'use strict';

			/**
			 * What this loader can do for a pane the extension pushes.
			 *
			 * The whole point of this file is to stop changing: the pane's markup, styling and
			 * behaviour now live in the extension and arrive over the same road the notes do, so
			 * updating the extension is enough to change the pane. Only a change to what the LOADER
			 * itself offers needs a new number here - and a new patch and restart with it.
			 *
			 * 1 - a pane is {css, html, js}; the js runs as an inline script in this document; the
			 *     pane talks to the host itself, using `source: 'ainotes-ui'` and the panel id.
			 */
			const LOADER = 1;

			// Handed to this frame in its url by the script that built it, and returned on every
			// message so the host can route the answer without relying on window identity.
			const panel = new URLSearchParams(location.search).get('panel');
			const boot = document.getElementById('ainotes-boot');
			const root = document.getElementById('ainotes-root');

			function post(kind, extra) {
				const message = { source: 'ainotes-ui', panel: panel, kind: kind };
				if (extra) {
					for (const name of Object.keys(extra)) {
						message[name] = extra[name];
					}
				}
				parent.postMessage(message, '*');
			}

			/**
			 * The loader's own message, in place of the pane.
			 *
			 * Built with `createElement` and `textContent` rather than markup, because the strings
			 * come from another process. The pane arrives as HTML on purpose - it is the
			 * extension's own file - but a revision string quoted back at us is data.
			 */
			function notice(text, linkText, onClick, detail) {
				root.style.display = 'none';
				boot.style.display = 'block';
				const line = document.createElement('div');
				line.textContent = text;
				if (linkText) {
					const link = document.createElement('a');
					link.textContent = linkText;
					link.setAttribute('role', 'button');
					link.tabIndex = 0;
					link.addEventListener('click', onClick);
					link.addEventListener('keydown', function (event) {
						if (event.key === 'Enter' || event.key === ' ') {
							event.preventDefault();
							onClick();
						}
					});
					line.appendChild(link);
				}
				const parts = [line];
				if (detail) {
					const note = document.createElement('div');
					note.className = 'detail';
					note.textContent = detail;
					parts.push(note);
				}
				boot.replaceChildren.apply(boot, parts);
			}

			function offerUpdate(detail) {
				notice(
					'You Must Update The Injected Script ',
					'Click here',
					function () {
						boot.replaceChildren(
							document.createTextNode('Updating the injected script...')
						);
						post('updateInjections');
					},
					detail
				);
			}

			/** The revision now running, so the same pane is not applied twice. */
			let applied = null;

			/**
			 * Put a pushed pane into this document.
			 *
			 * This document has no CSP of its own - it declares none, and VS Code adds none to a
			 * file it serves - so markup and an inline script here are exactly what they look like.
			 * The workbench document a few frames up allows neither: `script-src` has no
			 * `unsafe-inline` there, and Trusted Types refuse every HTML sink. That difference is
			 * the whole reason the pane can live in the extension and be delivered as text.
			 */
			function apply(data) {
				if ((data.needs || 1) > LOADER) {
					offerUpdate('this pane needs loader ' + data.needs + ', the injected one is ' + LOADER);
					return;
				}
				if (applied === data.revision) {
					return;
				}
				applied = data.revision;

				let style = document.getElementById('ainotes-pane-style');
				if (!style) {
					style = document.createElement('style');
					style.id = 'ainotes-pane-style';
					document.head.appendChild(style);
				}
				style.textContent = data.css || '';

				root.innerHTML = data.html || '';
				boot.style.display = 'none';
				root.style.display = 'flex';

				// Replaced rather than added to: a second copy would double every listener the pane
				// registers. The pane's own dispose hook handles the listeners it already owns.
				const previous = document.getElementById('ainotes-pane-script');
				if (previous) {
					previous.remove();
				}
				const script = document.createElement('script');
				script.id = 'ainotes-pane-script';
				script.textContent = data.js || '';
				document.body.appendChild(script);
			}

			window.addEventListener('message', function (event) {
				const data = event.data;
				if (!data || data.source !== 'ainotes-host') {
					return;
				}
				if (data.kind === 'ui') {
					apply(data);
					return;
				}
				if (data.kind === 'stale') {
					// The injected payload is not the one this extension ships. Notes are withheld
					// deliberately: showing them would look like it works while running code nobody
					// shipped, and a save from here could be handled by a contract that has changed.
					offerUpdate('injected ' + data.installed + ', extension ships ' + data.expected);
					return;
				}
				if (data.kind === 'patched') {
					// The files on disk are new; this document is still the old one, because the
					// workbench only reads them when it loads.
					notice('Please restart VS Code for the changes to take effect.');
				}
				// Everything else is the pane's business, and the pane listens for itself.
			});

			// Say we exist, and say what we can run. The host announces this panel until a pane and
			// its notes arrive, so there is nothing to retry from here.
			post('ready', { loader: LOADER });
		})();
	</script>
</body>
</html>
